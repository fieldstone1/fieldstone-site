<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Fieldstone Advisory</title>
<link rel="icon" type="image/png" href="/assets/brand/fieldstone-logo-square.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--forest:#1C4220;--brass:#9C7A3C;--stone:#EFEDE6;--paper:#FBFAF7;--ink:#1E1D1A;--ink-soft:rgba(30,29,26,.7);--stone-deep:rgba(156,122,60,.28);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
header{padding:18px 32px;border-bottom:1px solid var(--stone-deep);}
header img{height:32px;width:auto;display:block;}
main{flex:1;display:flex;align-items:center;padding:64px 28px;}
.box{max-width:560px;margin:0 auto;width:100%;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:"";width:20px;height:1px;background:var(--brass);}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.2;color:var(--ink);margin-bottom:16px;}
p{font-size:16px;color:var(--ink-soft);margin-bottom:28px;}
a.btn{display:inline-block;font-weight:600;font-size:14.5px;background:var(--forest);color:var(--paper);padding:12px 24px;border-radius:3px;text-decoration:none;}
a.btn:hover{background:var(--ink);}
a.btn:focus-visible,a.mail:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}
a.mail{color:var(--forest);border-bottom:1px solid var(--forest);text-decoration:none;}
</style>
</head>
<body>
<header><a href="/"><img src="/assets/brand/fieldstone-logo-horizontal.png" alt="Fieldstone Advisory"></a></header>
<main>
  <div class="box">
    <div class="eyebrow">404</div>
    <h1>That page doesn&rsquo;t exist.</h1>
    <p>The link may be out of date or mistyped. You can head back to the home page, or email <a class="mail" href="mailto:noah@fieldstone-advisory.com">noah@fieldstone-advisory.com</a> and we&rsquo;ll help you find what you need.</p>
    <a class="btn" href="/">Return to the home page</a>
  </div>
</main>
</body>
</html>
